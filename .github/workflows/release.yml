# Builds the signed Android APK and the desktop apps (Windows, macOS, Linux) and publishes them
# together as one GitHub Release.
# Trigger: push a tag like v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)
# Needs repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME);
      # Gradle downloads any missing platform / build-tools itself.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install, test and build the web app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # desktop shell isn't needed here
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.0-${GITHUB_SHA::7}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          QUIZZO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QUIZZO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QUIZZO_VERSION_NAME: ${{ steps.version.outputs.name }}
          QUIZZO_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi
          export QUIZZO_KEYSTORE_PATH="$RUNNER_TEMP/quizzo-release.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$QUIZZO_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$QUIZZO_KEYSTORE_PATH"

      - name: Check signature and rename
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$OUT"
          # Must be signed with the Quizzo release key, or updates won't install over earlier versions.
          echo "$OUT" | grep -qi "24fa6fd816d27c596a7493992727de4fbfc2b59514297e90b820e890c86c082c" \
            || { echo "::error::APK is not signed with the Quizzo release certificate"; exit 1; }
          cp "$APK" "quizzo-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: quizzo-apk
          path: quizzo-*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install, test and build the web app
        run: |
          npm ci
          npm test
          npm run build

      - name: Version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.0-${GITHUB_SHA::7}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Package desktop app
        shell: bash
        env:
          # No signing certificates: Windows shows a SmartScreen prompt, macOS needs right-click > Open.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version=${{ steps.version.outputs.name }}

      - uses: actions/upload-artifact@v5
        with:
          name: quizzo-desktop-${{ runner.os }}
          path: |
            release/Quizzo-*.exe
            release/Quizzo-*.dmg
            release/Quizzo-*.AppImage

  publish:
    if: github.ref_type == 'tag'
    needs: [apk, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Quizzo $GITHUB_REF_NAME" \
            --notes "Downloads:
          - **Android**: the .apk. Open it on your phone to install (allow installing from this source when asked).
          - **Windows**: Quizzo-Setup-….exe installs Quizzo; Quizzo-Portable-….exe runs without installing. Windows may show \"Windows protected your PC\" because the app isn't code-signed: click More info → Run anyway.
          - **macOS**: the .dmg for your Mac (arm64 = Apple silicon, x64 = Intel). The app isn't notarized: right-click Quizzo → Open the first time.
          - **Linux**: the .AppImage. Make it executable (chmod +x) and run it.

          Back up and move your decks between devices with ☁ Backup on the start screen (Google Sheet or a backup file).

          Android signing certificate SHA-256: 24:FA:6F:D8:16:D2:7C:59:6A:74:93:99:27:27:DE:4F:BF:C2:B5:95:14:29:7E:90:B8:20:E8:90:C8:6C:08:2C

          Known limitations on Android: read-aloud and dictation audio are not available yet, and saving files (Export JSON, backup file) doesn't work yet. Use the Google Sheet backup there."
